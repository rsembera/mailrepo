<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320">
  <!-- DMG installer background. GEOMETRY CONTRACT with packaging/dmg_settings.py:
       window 540x320, icon size 100; app icon CENTERED at (140,125),
       Applications alias at (400,125); the arrow runs between the slots.
       Finder chrome (title bar + bottom strip) consumes roughly the last
       60px of window height, so nothing readable sits below y=260.
       No logo up top: the app icon on the left IS the branding, and a
       second mark just reads as two different icons (S88 review).
       Rendered by: inkscape -> png (1x, 2x) -> tiffutil, see Mac guide. -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef7f3"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A9579"/>
    </marker>
  </defs>
  <rect width="540" height="320" fill="url(#wash)"/>

  <!-- Arrow between the icon slots (boxes span x 90..190 and 350..450) -->
  <line x1="215" y1="125" x2="318" y2="125"
        stroke="#3A9579" stroke-width="7" stroke-linecap="round" marker-end="url(#head)"/>

  <!-- Caption, above the chrome cutoff at y~260 -->
  <text x="270" y="228" text-anchor="middle"
        font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="16" font-weight="600" fill="#354E48">Drag MailRepo to Applications to install</text>
  <text x="270" y="250" text-anchor="middle"
        font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="12" fill="#6b8a80">Local-first encrypted email archiving</text>
</svg>
