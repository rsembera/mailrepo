<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='assets/favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='assets/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='assets/favicon-16x16.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='assets/apple-touch-icon.png') }}">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block styles %}{% endblock %}
    
    <!-- Apply theme and font early to prevent flash -->
    <script>
        (function() {
            // Theme
            const theme = localStorage.getItem('mailrepo-theme') || 'teal';
            document.documentElement.setAttribute('data-theme', theme);
            
            // Font family
            const font = localStorage.getItem('mailrepo-font') || 'lexend';
            const fontFamilies = {
                'lexend': "'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
                'inter': "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
                'system': "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            };
            document.documentElement.style.setProperty('--font-ui', fontFamilies[font] || fontFamilies['lexend']);
            document.documentElement.style.setProperty('--font-body', fontFamilies[font] || fontFamilies['lexend']);
            
            // Font size
            const size = localStorage.getItem('mailrepo-font-size') || 'm';
            const sizes = { 's': '14px', 'm': '16px', 'l': '18px' };
            document.documentElement.style.setProperty('--base-font-size', sizes[size] || '16px');
        })();
    </script>
</head>
<body class="{% block body_class %}{% endblock %}" data-theme="teal" style="font-size: var(--base-font-size, 16px);">
    {% block body %}
        {% block content %}{% endblock %}
    {% endblock %}
    
    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/lucide.min.js') }}"></script>
    {% block scripts %}{% endblock %}
    <script>
        // Apply theme to body as well (html already has it from head script)
        document.body.setAttribute('data-theme', localStorage.getItem('mailrepo-theme') || 'teal');
        // Apply font size to body
        const savedSize = localStorage.getItem('mailrepo-font-size') || 'm';
        const sizes = { 's': '14px', 'm': '16px', 'l': '18px' };
        document.body.style.fontSize = sizes[savedSize] || '16px';
        lucide.createIcons();
    </script>
</body>
</html>
